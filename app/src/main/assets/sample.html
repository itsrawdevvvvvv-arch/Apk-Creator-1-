<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080, initial-scale=1.0" />
<title>raw_edit // Kinetic Cream &amp; Crimson Reference Sample</title>
<style>
/* DESIGN TOKENS - measured by eye + pixel sampling from the two reference videos (stage = 1920x1080) */
:root{
  --crimson:#9A0B12; --crimson-deep:#6E0509; --crimson-bg-hi:#A80E15; --crimson-bg-lo:#4A0307;
  --cream-hi:#F2E5B6; --cream-mid:#E2CF98; --cream-lo:#B8985F;
  --card:#F4ECD8; --card-edge:#D9CBA3; --ink:#2A0A0A; --ink-soft:#4A1A16;
  --ghost-on-red:rgba(255,226,200,.13); --ghost-on-cream:rgba(154,11,18,.07);
  --font:"Poppins","Inter","Arial Black",system-ui,sans-serif;
  --fs-xl:230px; --fs-l:150px; --fs-m:100px; --fs-kicker:50px; --fs-sub:70px; --fs-pill:34px; --fs-prog:17px;
  --shadow-cream-text:0 9px 0 rgba(120,80,20,.28);
  --shadow-red-text:0 8px 22px rgba(0,0,0,.38);
  --shadow-card:0 40px 70px -20px rgba(80,40,10,.45), 0 6px 14px rgba(80,40,10,.18);
  --radius-card:64px; --radius-pill:999px;
}
html,body{margin:0;background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:var(--font);transform-origin:0 0}
.scene{position:absolute;inset:0;display:none}
.scene.cream{background:radial-gradient(ellipse 80% 75% at 50% 44%,var(--cream-hi) 0%,var(--cream-mid) 55%,var(--cream-lo) 100%)}
.scene.red{background:radial-gradient(ellipse 80% 75% at 50% 40%,var(--crimson-bg-hi) 0%,#8A0911 58%,var(--crimson-bg-lo) 100%)}
.el{position:absolute;white-space:nowrap;will-change:transform,opacity}
.ghost{position:absolute;left:50%;top:50%;font-weight:900;font-size:640px;line-height:1;letter-spacing:-.02em;white-space:nowrap;transform:translate(-50%,-50%)}
.red .ghost{color:var(--ghost-on-red)} .cream .ghost{color:var(--ghost-on-cream)}
.kicker{font-weight:800;font-size:var(--fs-kicker);text-transform:uppercase;letter-spacing:.02em}
.cream .kicker{color:var(--ink)} .red .kicker{color:var(--cream-hi)}
.kicker.small{font-size:34px;letter-spacing:.22em;font-weight:700}
.headline{font-weight:900;line-height:.92;letter-spacing:-.01em;text-transform:uppercase}
.headline .w{display:inline-block;margin-right:.22em;will-change:transform,opacity}
.headline.xl{font-size:var(--fs-xl)} .headline.l{font-size:var(--fs-l)} .headline.m{font-size:var(--fs-m)}
.cream .headline.crimson{color:var(--crimson);text-shadow:var(--shadow-cream-text)}
.cream .headline.ink{color:var(--ink);text-shadow:var(--shadow-cream-text)}
.red .headline{color:var(--cream-hi);text-shadow:var(--shadow-red-text)}
.headline.outline{color:transparent!important;-webkit-text-stroke:3px var(--cream-hi);text-shadow:none!important}
.sub{font-weight:800;font-size:var(--fs-sub);line-height:1;text-transform:uppercase}
.cream .sub{color:var(--ink)} .red .sub{color:var(--cream-hi)}
.pill{display:inline-flex;align-items:center;gap:14px;padding:16px 34px;border-radius:var(--radius-pill);font-weight:800;font-size:var(--fs-pill);text-transform:uppercase;letter-spacing:.04em;box-shadow:0 10px 18px rgba(60,20,10,.30)}
.pill.dark{background:var(--ink);color:var(--cream-hi)}
.pill.light{background:#F6EDD2;color:var(--crimson-deep);box-shadow:0 8px 16px rgba(80,40,10,.22)}
.pill.red{background:var(--crimson);color:var(--cream-hi)}
.chips{display:flex;flex-wrap:wrap;gap:16px;white-space:normal}
.chips .pill{font-size:30px;padding:13px 28px}
.card{position:absolute;background:linear-gradient(160deg,#F8F1DC 0%,var(--card) 55%,var(--card-edge) 100%);border-radius:var(--radius-card);box-shadow:var(--shadow-card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.card svg{width:52%;height:auto}
.card .label{font-weight:900;font-size:34px;color:var(--ink);text-transform:uppercase}
.card .num{font-weight:800;font-size:22px;background:var(--ink);color:var(--cream-hi);border-radius:999px;padding:4px 16px}
.card.redcard{background:linear-gradient(160deg,#C4161E,var(--crimson))}
.brackets{position:absolute;pointer-events:none}
.brackets i{position:absolute;width:56px;height:56px;border:0 solid var(--crimson)}
.brackets i:nth-child(1){left:0;top:0;border-width:7px 0 0 7px}.brackets i:nth-child(2){right:0;top:0;border-width:7px 7px 0 0}
.brackets i:nth-child(3){left:0;bottom:0;border-width:0 0 7px 7px}.brackets i:nth-child(4){right:0;bottom:0;border-width:0 7px 7px 0}
.phone{position:absolute;border-radius:70px;background:#101010;padding:14px;box-shadow:0 50px 80px -20px rgba(40,10,5,.55),0 0 0 3px #2a2a2a}
.phone .screen{width:100%;height:100%;border-radius:58px;background:#1b1b1f center/cover no-repeat;overflow:hidden;position:relative}
.phone .screen.ph{background:repeating-linear-gradient(0deg,#26262c 0 46px,#1b1b1f 46px 70px)}
.btn{display:inline-flex;align-items:center;gap:18px;padding:26px 48px;border-radius:26px;background:#F8F1DC;color:var(--crimson-deep);font-weight:800;font-size:38px;box-shadow:0 14px 26px rgba(40,5,5,.35)}
.btn.dark{background:var(--ink);color:var(--cream-hi);border-radius:var(--radius-pill)}
.btn svg{width:42px;height:42px;fill:currentColor}
.comment{display:flex;align-items:center;gap:20px;width:900px;padding:18px 20px 18px 28px;border-radius:var(--radius-pill);background:#FBF4DF;box-shadow:0 16px 30px rgba(40,5,5,.35);font-weight:700;font-size:44px;color:var(--ink)}
.comment .av{width:64px;height:64px;border-radius:50%;background:var(--crimson)}
.comment .txt{flex:1} .comment .post{background:var(--crimson);color:#fff;border-radius:var(--radius-pill);padding:12px 34px;font-size:34px;font-weight:800}
.strike{position:relative;display:inline-block}.strike b{position:absolute;left:-2%;top:52%;height:14px;background:var(--ink);border-radius:8px;width:0}
.round{border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-card);background:#F6EDD2}
.round svg{width:56%;height:56%}
.dust{position:absolute;border-radius:50%;background:rgba(150,60,40,.30)}
.progress{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);display:flex;gap:22px;width:960px}
.progress .seg{flex:1}.progress .lab{font-weight:700;font-size:var(--fs-prog);letter-spacing:.18em;text-transform:uppercase;margin-bottom:8px}
.progress .bar{height:6px;border-radius:4px}
.on-cream .lab{color:var(--ink)}.on-cream .bar{background:rgba(120,80,30,.28)}.on-cream .fill{background:var(--crimson)}
.on-red .lab{color:var(--cream-hi)}.on-red .bar{background:rgba(255,226,200,.28)}.on-red .fill{background:var(--cream-hi)}
.fill{height:100%;width:0;border-radius:4px}

</style>

     if(i<o.items.length-1){const p=el('el','+',{left:(x+cw+gap/2)+'px',top:(o.y+ch/2-40)+'px',fontSize:'72px',fontWeight:900,color:'var(--crimson)',transform:'translateX(-50%)'});p._base='translateX(-50%)';items.push({n:p,at:o.at+i*(o.stagger||.7)+.35,dur:.25,anim:'pop'})}
     x+=cw+gap});return items},
 phone:(o)=>{const n=el('phone','<div class="screen'+(o.img?'':' ph')+'"></div>');pos(n,{x:o.x,y:o.y,w:o.w||420,h:o.h||850,anchor:o.anchor});
   if(o.img)n.firstChild.style.backgroundImage=`url("${o.img}")`;return[{n,at:o.at,dur:.45,anim:o.anim||'rise'}]},
 buttons:(o)=>{const wrap=el('el');pos(wrap,o);wrap.style.display='flex';wrap.style.gap='28px';const items=[{n:wrap,at:0,dur:.01,anim:'none'}];
   o.items.forEach((b,i)=>{const n=el('btn'+(b.dark?' dark':''),ico(b.icon)+b.label);wrap.appendChild(n);items.push({n,at:o.at+i*.25,dur:.3,anim:'pop',base:''})});return items},
 comment:(o)=>{const n=el('el comment','<div class="av"></div><div class="txt"></div><div class="post">POST</div>');pos(n,o);const txt=n.querySelector('.txt');
   n._upd=(lt)=>{const c=Math.floor(clamp((lt-o.at-.3)/(o.typeSecs||.8))*o.text.length);txt.textContent=o.text.slice(0,c)+(c<o.text.length||Math.floor(lt*2)%2?'|':'')};
   return[{n,at:o.at,dur:.3,anim:'rise'}]},
 round:(o)=>{const w=o.w||150;const n=el('el round',ico(o.icon));n.style.width=n.style.height=w+'px';n.style.color=o.color||'var(--crimson)';pos(n,{x:o.x,y:o.y,anchor:o.anchor});return[{n,at:o.at,dur:.35,anim:o.anim||'pop'}]}
};
// ---- build scenes
P.scenes.forEach(s=>{s.node=el('scene '+s.bg);s.items=[];s._extra=[];stage.appendChild(s.node);
  (s.els||[]).forEach(o=>{const its=build[o.t](o,s);its.forEach(it=>{if(it.n.parentNode!==undefined&&!it.n.parentNode)s.node.appendChild(it.n);it.base=it.base??it.n._base??'';s.items.push(it);if(it.n._upd)s.items.push({upd:it.n._upd})});});
  // attach only top-level nodes (children already inside parents)
  s.items.forEach(it=>{if(it.n&&!it.n.parentNode)s.node.appendChild(it.n)});s._extra.forEach(b=>s.node.appendChild(b));});
// dust
const dust=[];for(let i=0;i<16;i++){const d=el('dust');const r=3+((i*7)%5);d.style.width=d.style.height=r+'px';d._x=(i*337)%1920;d._y=(i*211)%1000;d._s=4+(i%5)*2;stage.appendChild(d);dust.push(d)}
// progress
const prog=el('progress');(P.progress||[]).forEach(g=>{const sg=el('seg',`<div class="lab">${g.label}</div><div class="bar"><div class="fill"></div></div>`);prog.appendChild(sg);g.fill=sg.querySelector('.fill')});stage.appendChild(prog);
function applyAnim(it,p){const n=it.n,b=it.base||'';let o=1,tf='';
  switch(it.anim){case'pop':o=clamp(p*4);tf=`scale(${.55+.45*back(p)})`;break;case'rise':o=easeOut(p);tf=`translateY(${(1-easeOut(p))*46}px)`;break;
   case'slide':o=easeOut(p);tf=`translateX(${(1-easeOut(p))*-90}px)`;break;case'fade':o=easeOut(p);break;case'none':o=1;break;
   case'wipe':n.style.width=(easeOut(p)*104)+'%';o=p>0?1:0;break;}
  n.style.opacity=o;n.style.transform=(b+' '+tf).trim();}
window.seek=function(t){
  let cur=null;P.scenes.forEach(s=>{const on=t>=s.start&&t<s.end;s.node.style.display=on?'block':'none';if(!on)return;cur=s;const lt=t-s.start;
    if(s.ghost)s.ghost.style.transform=`translate(-50%,-50%) scale(${1+.06*lt/(s.end-s.start)})`;
    s.items.forEach(it=>{if(it.upd)it.upd(lt);else applyAnim(it,clamp((lt-it.at)/it.dur))})});
  dust.forEach(d=>{d.style.left=d._x+'px';d.style.top=((d._y-t*d._s+1080*10)%1000)+'px';d.style.display=cur&&cur.bg==='cream'?'block':'none'});
  const cls=cur&&cur.bg==='red'?'on-red':'on-cream';prog.className='progress '+cls;
  (P.progress||[]).forEach(g=>g.fill.style.width=(clamp((t-g.from)/(g.to-g.from))*100)+'%');
};
window.PROJECT_DURATION=P.duration;seek(0);
})();

  </script>
  <script>
    window.RAW = {
      duration: window.PROJECT ? window.PROJECT.duration : 49.1,
      fps: 30,
      width: 1920,
      height: 1080,
      seek: function(tSeconds) {
        if (typeof window.seek === 'function') {
          window.seek(Number(tSeconds) || 0);
        }
        return true;
      }
    };
    window.RAW.seek(0);
  </script>
